<!DOCTYPE html>
<html>
<head>
    <title>36x36 Square Tiling Puzzle</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column;
                align-items: center; justify-content: center; padding: 20px; background-color: #f0f0f0; }
        #game-container { display: flex; gap: 20px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        canvas { border: 2px solid #333; background: #fff; cursor: crosshair; }
        #sidebar { width: 200px; }
        .spawn-btn {
            display: block; width: 100%; padding: 10px; margin-bottom: 8px;
            cursor: pointer; background: #eee; border: 1px solid #ccc; border-radius: 4px;
        }
        .spawn-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        body { 
        background-color: #f4f1ea; /* Soft parchment beige */
        color: #4a4a4a;
        }
        #game-container { 
            background: #ffffff; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); /* Softer shadow */
        }
        canvas { 
            border: 1px solid #d1ccc0; 
            border-radius: 4px;
            background: #faf9f6; 
        }
        .spawn-btn {
            background: #e0e0e0;
            border: none;
            border-radius: 6px;
            color: #555;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .spawn-btn:hover:not(:disabled) {
            background: #d4d4d4;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div id="homeScreen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; color: white;">
        <h1>36x36 Tiling Challenge</h1>
        <p>Choose your difficulty:</p>
        <div style="display: flex; gap: 20px;">
            <button onclick="selectDifficulty('easy')" style="padding: 15px 30px; cursor: pointer;">Easy</button>
            <button onclick="selectDifficulty('medium')" style="padding: 15px 30px; cursor: pointer;">Medium</button>
            <button onclick="selectDifficulty('hard')" style="padding: 15px 30px; cursor: pointer;">Hard</button>
        </div>
    </div>

    <div style="text-align: center; margin-bottom: 30px; margin-top: 20px;">
        <h1 style="font-weight: 300; letter-spacing: 4px; color: #5d5d5d; margin-bottom: 10px; text-transform: uppercase;">
            Partridge Tiling
        </h1>
        <div style="width: 60px; height: 1px; background: #d1ccc0; margin: 0 auto;"></div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="sidebar">
            <h2 style="margin-top: 0;">Supply</h2>
            <div id="buttonContainer"></div>
            <button id="checkBtn" style="width: 100%; padding: 10px; margin-top: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;">Check Solution</button>
            <button id="resetBtn" style="width: 100%; padding: 10px; margin-top: 10px; background-color: #ff4444; color: white; border: none; border-radius: 4px; cursor: pointer;">Reset Board</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io({ transports: ['websocket'] });
        const GRID_SIZE = 12;
        const BOARD_LIMIT = 36 * GRID_SIZE;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = BOARD_LIMIT + 150; // Extra room for spawn area
        canvas.height = BOARD_LIMIT;

        let pieces = [], myId = null, activePieceId = null;

        function selectDifficulty(level) {
            document.getElementById('homeScreen').style.display = 'none';
            socket.emit('startGame', level);
        }

        socket.on('init', (data) => {
            myId = data.id;
            pieces = data.pieces;
            updateUI(data.inventory);
            draw();
        });

        socket.on('stateUpdate', (data) => {
            pieces = data.pieces;
            const myHeld = pieces.find(p => p.heldBy === myId);
            activePieceId = myHeld ? myHeld.id : null;
            updateUI(data.inventory);
            draw();
        });

        function updateUI(inventory) {
            const container = document.getElementById('buttonContainer');
            container.innerHTML = '';
            for (let size = 8; size >= 1; size--) {
                const btn = document.createElement('button');
                btn.className = 'spawn-btn';
                btn.innerText = `Size ${size} (${inventory[size]} left)`;
                btn.disabled = inventory[size] <= 0 || activePieceId !== null;
                btn.onclick = () => socket.emit('spawnPiece', size);
                container.appendChild(btn);
            }
        }

        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            
            // Use Math.round instead of Math.floor for more intuitive "snapping"
            // and strictly calculate relative to the canvas's bounding box
            return {
                x: Math.round((evt.clientX - rect.left) / GRID_SIZE) * GRID_SIZE,
                y: Math.round((evt.clientY - rect.top) / GRID_SIZE) * GRID_SIZE
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            const pos = getMousePos(e);
            if (!activePieceId) {
                const clicked = pieces.find(p => pos.x >= p.x && pos.x < p.x + (p.size * GRID_SIZE) && pos.y >= p.y && pos.y < p.y + (p.size * GRID_SIZE));
                if (clicked && !clicked.heldBy && !clicked.isLocked) socket.emit('pickUp', clicked.id);
            } else {
                activePieceId = null;
                socket.emit('dropPiece');
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (!activePieceId) return;
            
            const rect = canvas.getBoundingClientRect();
            const piece = pieces.find(p => p.id === activePieceId);
            if (!piece) return;

            // Calculate the size of the piece in pixels
            const pixelSize = piece.size * GRID_SIZE;

            // Adjust the mouse position so the center of the square follows the cursor
            const rawX = e.clientX - rect.left - (pixelSize / 2);
            const rawY = e.clientY - rect.top - (pixelSize / 2);

            // Snap the adjusted position to the grid
            const snapX = Math.round(rawX / GRID_SIZE) * GRID_SIZE;
            const snapY = Math.round(rawY / GRID_SIZE) * GRID_SIZE;

            socket.emit('movePiece', { id: activePieceId, x: snapX, y: snapY });
        });

        function drawRoundedRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            ctx.fill();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#fff";
            ctx.fillRect(0, 0, BOARD_LIMIT, BOARD_LIMIT);
            ctx.strokeStyle = "#eee";
            for(let i=0; i<=BOARD_LIMIT; i+=GRID_SIZE) {
                ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i, BOARD_LIMIT); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(BOARD_LIMIT, i); ctx.stroke();
            }
            ctx.strokeStyle = "#333"; ctx.lineWidth = 2;
            ctx.strokeRect(0, 0, BOARD_LIMIT, BOARD_LIMIT);

            pieces.forEach(p => {
                const px = p.size * GRID_SIZE;
                
                ctx.save(); // Save current state
                
                if (p.heldBy === myId) {
                    // Add shadow only to the piece you are holding
                    ctx.shadowColor = "rgba(0, 0, 0, 0.2)";
                    ctx.shadowBlur = 15;
                    ctx.shadowOffsetX = 5;
                    ctx.shadowOffsetY = 5;
                    
                    // Slightly scale it up to look "lifted"
                    ctx.fillStyle = p.color;
                    drawRoundedRect(ctx, p.x - 1, p.y - 1, px + 2, px + 2, 6);
                } else {
                    ctx.fillStyle = p.color;
                    drawRoundedRect(ctx, p.x + 1, p.y + 1, px - 2, px - 2, 4);
                }

                // Apply the Muted Sage/Terracotta borders
                if (p.heldBy) {
                    ctx.strokeStyle = p.heldBy === myId ? "#81b29a" : "#e07a5f";
                    ctx.lineWidth = 2;
                    ctx.stroke(); 
                } else {
                    ctx.strokeStyle = "rgba(0,0,0,0.05)";
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
                
                ctx.restore(); // Restore state to remove shadow for next pieces
            });
        }

        document.getElementById('resetBtn').onclick = () => confirm("Reset board?") && socket.emit('resetBoard');
        document.getElementById('checkBtn').onclick = () => socket.emit('checkSolution');
        socket.on('solutionResult', (res) => alert(res ? "🎉 Correct!" : "❌ Try again!"));
    </script>
</body>
</html>
