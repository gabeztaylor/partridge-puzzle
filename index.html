<!DOCTYPE html>
<html>
<head>
    <title>Partridge Tiling Puzzle</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; 
            padding: 40px; background-color: #f4f1ea; margin: 0;
        }
        #homeScreen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 1000; color: white; 
        }
        .home-card {
            width: min(560px, calc(100vw - 48px));
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 14px;
            padding: 22px 22px 18px;
            box-shadow: 0 16px 50px rgba(0,0,0,0.35);
            backdrop-filter: blur(10px);
        }
        .home-label {
            display: block;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0.85;
            margin: 0 0 10px;
        }
        .home-row {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        .text-input {
            appearance: none;
            width: min(360px, 100%);
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.18);
            background: rgba(255,255,255,0.10);
            color: #fff;
            outline: none;
        }
        .text-input::placeholder { color: rgba(255,255,255,0.55); }
        .text-input:focus {
            border-color: rgba(129,178,154,0.9);
            box-shadow: 0 0 0 4px rgba(129,178,154,0.25);
        }
        .help-text {
            font-size: 0.8em;
            color: rgba(255,255,255,0.70);
            margin: 10px 0 0;
        }
        .btn {
            appearance: none;
            border: 0;
            border-radius: 10px;
            padding: 12px 14px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 0.02em;
            transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
            user-select: none;
        }
        .btn:active { transform: translateY(1px); }
        .btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 4px rgba(255,255,255,0.16);
        }
        .btn-primary {
            background: linear-gradient(180deg, #81b29a 0%, #6ea88f 100%);
            color: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.28);
        }
        .btn-primary:hover { filter: brightness(1.06); }

        .difficulty-wrap { margin-top: 18px; }
        .difficulty-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
        .difficulty-btn {
            min-width: 130px;
            padding: 12px 16px;
            color: #1e1e1e;
            background: rgba(255,255,255,0.90);
            border: 1px solid rgba(255,255,255,0.22);
            box-shadow: 0 10px 22px rgba(0,0,0,0.22);
        }
        .difficulty-btn:hover { filter: brightness(1.03); transform: translateY(-1px); }
        .difficulty-btn:active { transform: translateY(0px); }
        .difficulty-btn.easy { border-color: rgba(129,178,154,0.55); }
        .difficulty-btn.medium { border-color: rgba(244,162,97,0.55); }
        .difficulty-btn.hard { border-color: rgba(224,122,95,0.55); }
        .difficulty-subtext { opacity: 0.8; font-size: 0.9rem; margin: 0; }
        .divider { width: 100%; height: 1px; background: rgba(255,255,255,0.14); margin: 18px 0; }

        #game-container { 
            display: flex; gap: 30px; background: white; padding: 30px; 
            border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); 
            align-items: flex-start;
        }
        canvas {
            border: 1px solid #d1ccc0;
            border-radius: 4px;
            background: #faf9f6;
            cursor: crosshair;
            flex: 0 0 auto;
            display: block;
        }
        #sidebar { width: 220px; }
        #roomInfo {
            margin-bottom: 10px;
        }
        #roomLabel {
            font-size: 0.72rem;
            letter-spacing: 0.10em;
            text-transform: uppercase;
            color: rgba(93,93,93,0.80);
            margin-bottom: 6px;
        }
        #usersList {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .user-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            border-radius: 999px;
            background: rgba(244,241,234,0.85);
            border: 1px solid rgba(0,0,0,0.08);
            color: #5d5d5d;
            font-size: 12px;
            font-weight: 650;
            max-width: 100%;
        }
        .user-chip.me {
            border-color: rgba(129,178,154,0.45);
            background: rgba(129,178,154,0.12);
        }
        .user-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(93,93,93,0.35);
            flex: 0 0 auto;
        }
        .user-chip.me .user-dot { background: rgba(129,178,154,0.85); }
        .user-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #supplyArea { position: relative; }
        #supplyHeader {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 6px;
        }
        .menu-open-btn {
            appearance: none;
            border: 1px solid rgba(0,0,0,0.10);
            background: #f4f1ea;
            color: #5d5d5d;
            border-radius: 10px;
            padding: 8px 10px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 0.02em;
            transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
            flex: 0 0 auto;
        }
        .menu-open-btn:hover { filter: brightness(1.02); transform: translateY(-1px); }
        .menu-open-btn:active { transform: translateY(0px); }
        .menu-open-btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 4px rgba(129,178,154,0.18);
        }
        #menuOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.18);
            z-index: 900;
        }
        #menuModal {
            display: none;
            position: absolute;
            top: 0;
            left: calc(100% + 16px);
            width: 240px;
            background: white;
            border-radius: 12px;
            border: 1px solid rgba(0,0,0,0.08);
            box-shadow: 0 18px 60px rgba(0,0,0,0.18);
            padding: 14px;
            z-index: 1000;
        }
        #menuModalHeader {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .menu-title {
            margin: 0;
            font-size: 0.95rem;
            color: #5d5d5d;
            letter-spacing: 0.10em;
            text-transform: uppercase;
            font-weight: 700;
        }
        .menu-close-btn {
            appearance: none;
            border: 0;
            background: transparent;
            cursor: pointer;
            color: #888;
            font-weight: 800;
            font-size: 18px;
            line-height: 1;
            padding: 6px 8px;
            border-radius: 8px;
        }
        .menu-close-btn:hover { background: rgba(0,0,0,0.05); }
        .menu-actions {
            display: grid;
            gap: 10px;
        }
        #buttonContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-content: flex-start;
            padding-top: 6px;
        }
        .supply-tile {
            width: var(--tile-side);
            height: var(--tile-side);
            padding: 0;
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 10px;
            background: var(--tile-color);
            cursor: pointer;
            position: relative;
            display: grid;
            place-items: center;
            box-shadow: 0 10px 22px rgba(0,0,0,0.12);
            transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease;
            user-select: none;
        }
        .supply-tile:hover:not(:disabled) { filter: brightness(1.03); transform: translateY(-1px); }
        .supply-tile:active:not(:disabled) { transform: translateY(0px); }
        .supply-tile:focus-visible {
            outline: none;
            box-shadow: 0 0 0 4px rgba(129,178,154,0.20), 0 10px 22px rgba(0,0,0,0.12);
        }
        .supply-tile:disabled {
            opacity: 0.40;
            cursor: not-allowed;
            filter: grayscale(0.15);
            box-shadow: none;
            transform: none;
        }
        .supply-count {
            font-weight: 800;
            color: rgba(0,0,0,0.60);
            text-shadow: 0 1px 0 rgba(255,255,255,0.35);
            font-size: clamp(12px, calc(var(--tile-side) * 0.35), 22px);
            line-height: 1;
        }
        .supply-size {
            position: absolute;
            bottom: 6px;
            right: 8px;
            font-size: 11px;
            font-weight: 700;
            color: rgba(0,0,0,0.45);
        }
        
        .action-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; cursor: pointer; color: white; }
    </style>
</head>
<body>

    <div id="homeScreen">
        <h1 style="letter-spacing: 4px; text-transform: uppercase;">Partridge Tiling</h1>
        
        <div class="home-card">
        <div id="roomControls" style="text-align: center;">
            <label class="home-label" for="nameInput">Your name</label>
            <input type="text" id="nameInput" class="text-input" placeholder="Name (required)" maxlength="20">

            <label class="home-label" for="roomInput">Room</label>
            <input type="text" id="roomInput" class="text-input" placeholder="Room Name (e.g. 'Lab')">
            
            <div class="home-row" style="margin-top: 12px;">
                <button class="btn btn-primary" onclick="joinSpecificRoom()">Enter Room</button>
            </div>
            <p class="help-text">
                If the room is empty, you'll be asked to set the difficulty.
            </p>
        </div>
    
        <div class="divider"></div>
    
        <div id="difficultySection" class="difficulty-wrap" style="text-align: center;">
            <p class="difficulty-subtext">This room is empty. Select a difficulty to seed the board:</p>
            <div class="difficulty-row">
                <button class="btn difficulty-btn easy" onclick="selectDifficulty('easy')">Easy</button>
                <button class="btn difficulty-btn medium" onclick="selectDifficulty('medium')">Medium</button>
                <button class="btn difficulty-btn hard" onclick="selectDifficulty('hard')">Hard</button>
            </div>
        </div>
        </div>
    </div>

    <div style="text-align: center; margin-bottom: 30px;">
        <h1 style="font-weight: 300; letter-spacing: 4px; color: #5d5d5d; text-transform: uppercase;">Partridge Tiling</h1>
        <div style="width: 60px; height: 1px; background: #d1ccc0; margin: 0 auto;"></div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="sidebar">
            <div id="supplyArea">
                <div id="roomInfo">
                    <div id="roomLabel">Room: …</div>
                    <div id="usersList"></div>
                </div>
                <div id="supplyHeader">
                    <h2 style="margin: 0; color: #5d5d5d;">Supply</h2>
                    <button id="openMenuBtn" class="menu-open-btn" type="button">Menu</button>
                </div>
                <div id="buttonContainer"></div>

                <div id="menuOverlay"></div>
                <div id="menuModal" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
                    <div id="menuModalHeader">
                        <div id="menuTitle" class="menu-title">Menu</div>
                        <button id="closeMenuBtn" class="menu-close-btn" type="button" aria-label="Close menu">×</button>
                    </div>
                    <div class="menu-actions">
                        <button id="backToLobbyBtn" class="action-btn" style="background-color: #f4f1ea; color: #5d5d5d; border: 1px solid #d1ccc0;">
                            Back to Lobby / Change Room
                        </button>
                        <button id="checkBtn" class="action-btn" style="background-color: #4CAF50;">Check Solution</button>
                        <button id="resetBtn" class="action-btn" style="background-color: #e07a5f;">Reset Board</button>
                        <button onclick="copyInvite()" class="action-btn" style="background-color: #f4f1ea; color: #5d5d5d; border: 1px solid #d1ccc0;">
                            Copy Invite Link
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io({ transports: ['websocket'] });
        const GRID_SIZE = 12;
        const BOARD_LIMIT = 36 * GRID_SIZE;
        const TRAY_WIDTH = 150; // space to the right of the board for newly spawned pieces
        const CANVAS_WIDTH = BOARD_LIMIT + TRAY_WIDTH;
        const CANVAS_HEIGHT = BOARD_LIMIT;
        const CALM_COLORS = {
            1: "#b8c1ec", 2: "#a2d2ff", 3: "#ccd5ae", 4: "#e9edc9",
            5: "#fae1dd", 6: "#fec89a", 7: "#dec0f1", 8: "#957fef"
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        // Keep canvas sizing consistent (prevents non-uniform stretching that makes squares look like rectangles)
        function resizeCanvas() {
            const dpr = Math.max(1, window.devicePixelRatio || 1);
            canvas.style.width = `${CANVAS_WIDTH}px`;
            canvas.style.height = `${CANVAS_HEIGHT}px`;
            canvas.width = Math.round(CANVAS_WIDTH * dpr);
            canvas.height = Math.round(CANVAS_HEIGHT * dpr);
            // Draw in "CSS pixel" coordinates so GRID_SIZE math stays correct.
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resizeCanvas();

        let pieces = [], myId = null, activePieceId = null;
        let forceHomeScreen = false;
        let playerName = (localStorage.getItem('playerName') || '').trim();

        // 1. ROOM HANDLING
        let roomID = window.location.hash.substring(1) || "lobby";
        if (!window.location.hash) window.location.hash = "lobby";

        const nameInputEl = document.getElementById('nameInput');
        if (nameInputEl) nameInputEl.value = playerName;

        function savePlayerName(nextName) {
            playerName = (nextName || '').trim();
            localStorage.setItem('playerName', playerName);
        }

        function renderUsers(usersObj) {
            const listEl = document.getElementById('usersList');
            const labelEl = document.getElementById('roomLabel');
            if (labelEl) labelEl.innerText = `Room: ${roomID}`;
            if (!listEl) return;

            const entries = Object.entries(usersObj || {}).map(([id, name]) => ({ id, name }));
            entries.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
            listEl.innerHTML = '';

            if (entries.length === 0) {
                const chip = document.createElement('div');
                chip.className = 'user-chip';
                chip.innerText = 'No one here yet';
                listEl.appendChild(chip);
                return;
            }

            entries.forEach(u => {
                const chip = document.createElement('div');
                chip.className = `user-chip${u.id === myId ? ' me' : ''}`;

                const dot = document.createElement('div');
                dot.className = 'user-dot';
                chip.appendChild(dot);

                const name = document.createElement('div');
                name.className = 'user-name';
                name.innerText = u.name || 'Unknown';
                chip.appendChild(name);

                listEl.appendChild(chip);
            });
        }

        function tryJoinRoom(targetRoomId) {
            if (!playerName) {
                forceHomeScreen = true;
                document.getElementById('homeScreen').style.display = 'flex';
                document.getElementById('nameInput')?.focus();
                renderUsers({});
                return;
            }
            socket.emit('joinRoom', { roomId: targetRoomId, name: playerName });
        }

        tryJoinRoom(roomID);

        function switchRoom(nextRoomId) {
            // Always drop any held piece in the current room before moving rooms
            socket.emit('dropPiece', { roomId: roomID });
            activePieceId = null;

            roomID = nextRoomId;
            window.location.hash = nextRoomId;

            // Clear current local pieces so the 'init' logic starts fresh
            pieces = [];
            renderUsers({});
            tryJoinRoom(roomID);
        }

        function joinSpecificRoom() {
            const nameVal = document.getElementById('nameInput')?.value?.trim() || '';
            if (!nameVal) {
                alert("Please enter a name first.");
                document.getElementById('nameInput')?.focus();
                return;
            }
            savePlayerName(nameVal);

            const input = document.getElementById('roomInput').value.trim();
            if (input) {
                forceHomeScreen = false;
                switchRoom(input);
                console.log("Switching to room:", input);
            }
        }

        function copyInvite() {
            navigator.clipboard.writeText(window.location.href);
            alert("Invite link copied to clipboard!");
        }

        function openRoomPicker() {
            forceHomeScreen = true;
            document.getElementById('homeScreen').style.display = 'flex';
            const nameEl = document.getElementById('nameInput');
            if (nameEl && !nameEl.value) nameEl.value = playerName;
            const input = document.getElementById('roomInput');
            if (input) {
                input.value = '';
                input.focus();
                input.select?.();
            }
        }

        // 2. SOCKET RECEIVERS
        socket.on('init', (data) => {
            myId = data.id;
            if (data.roomId) roomID = data.roomId;
            pieces = data.pieces;
            renderUsers(data.users || {});
            
            // If the room has pieces, hide the setup. If not, show it.
            if (!forceHomeScreen && pieces && pieces.length > 0) {
                document.getElementById('homeScreen').style.display = 'none';
            } else {
                document.getElementById('homeScreen').style.display = 'flex';
            }
            
            updateUI(data.inventory);
            draw();
        });

        socket.on('stateUpdate', (data) => {
            pieces = data.pieces;
            const myHeld = pieces.find(p => p.heldBy === myId);
            activePieceId = myHeld ? myHeld.id : null;
            updateUI(data.inventory);
            renderUsers(data.users || {});
            draw();
        });

        socket.on('usersUpdate', (data) => {
            if (data?.roomId && data.roomId !== roomID) return;
            renderUsers(data.users || {});
        });

        socket.on('nameRequired', () => {
            forceHomeScreen = true;
            document.getElementById('homeScreen').style.display = 'flex';
            alert("Please enter a name to join the room.");
            document.getElementById('nameInput')?.focus();
        });

        // 3. ACTIONS (Adding roomId to every payload)
        function selectDifficulty(level) {
            document.getElementById('homeScreen').style.display = 'none';
            forceHomeScreen = false;
            socket.emit('startGame', { difficulty: level, roomId: roomID });
        }

        function updateUI(inventory) {
            const container = document.getElementById('buttonContainer');
            container.innerHTML = '';

            // Scale the supply tiles to the sidebar width so "size 8" is the largest square that fits.
            // (Still wraps into multiple columns for smaller sizes.)
            const containerWidth = container.clientWidth || 220;
            // Make the palette a bit more compact than "full width".
            const PALETTE_SCALE = 0.72; // lower = smaller tiles
            const unit = Math.max(8, Math.floor(((containerWidth - 12) / 8) * PALETTE_SCALE));

            for (let size = 8; size >= 1; size--) {
                const btn = document.createElement('button');
                btn.className = 'supply-tile';
                btn.style.setProperty('--tile-side', `${size * unit}px`);
                btn.style.setProperty('--tile-color', CALM_COLORS[size] || '#e0e0e0');
                btn.title = `Size ${size} (${inventory[size]} left)`;
                btn.setAttribute('aria-label', `Spawn size ${size}. ${inventory[size]} remaining.`);
                btn.disabled = inventory[size] <= 0 || activePieceId !== null;
                btn.onclick = () => socket.emit('spawnPiece', { size, roomId: roomID });

                // Avoid text clutter on very small tiles.
                if (size >= 3) {
                    const count = document.createElement('div');
                    count.className = 'supply-count';
                    count.innerText = `${inventory[size]}`;
                    btn.appendChild(count);

                    const sizeTag = document.createElement('div');
                    sizeTag.className = 'supply-size';
                    sizeTag.innerText = `${size}×${size}`;
                    btn.appendChild(sizeTag);
                }

                container.appendChild(btn);
            }
        }

        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: Math.round((evt.clientX - rect.left) / GRID_SIZE) * GRID_SIZE,
                y: Math.round((evt.clientY - rect.top) / GRID_SIZE) * GRID_SIZE
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            const pos = getMousePos(e);
            if (!activePieceId) {
                const clicked = pieces.find(p => 
                    pos.x >= p.x && pos.x < p.x + (p.size * GRID_SIZE) && 
                    pos.y >= p.y && pos.y < p.y + (p.size * GRID_SIZE)
                );
                if (clicked && !clicked.heldBy && !clicked.isLocked) {
                    socket.emit('pickUp', { pieceId: clicked.id, roomId: roomID });
                }
            } else {
                activePieceId = null;
                socket.emit('dropPiece', { roomId: roomID });
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (!activePieceId) return;
            const rect = canvas.getBoundingClientRect();
            const piece = pieces.find(p => p.id === activePieceId);
            if (!piece) return;

            const pixelSize = piece.size * GRID_SIZE;
            const rawX = e.clientX - rect.left - (pixelSize / 2);
            const rawY = e.clientY - rect.top - (pixelSize / 2);

            const snapX = Math.round(rawX / GRID_SIZE) * GRID_SIZE;
            const snapY = Math.round(rawY / GRID_SIZE) * GRID_SIZE;

            socket.emit('movePiece', { id: activePieceId, x: snapX, y: snapY, roomId: roomID });
        });

        // 4. RENDERING (Zen/Calm Aesthetic)
        function drawRoundedRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            ctx.fill();
        }

        function draw() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            ctx.fillStyle = "#fff";
            ctx.fillRect(0, 0, BOARD_LIMIT, BOARD_LIMIT);
            ctx.strokeStyle = "#f0f0f0"; 
            for(let i=0; i<=BOARD_LIMIT; i+=GRID_SIZE) {
                ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i, BOARD_LIMIT); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(BOARD_LIMIT, i); ctx.stroke();
            }
            ctx.strokeStyle = "#d1ccc0"; ctx.lineWidth = 1;
            ctx.strokeRect(0, 0, BOARD_LIMIT, BOARD_LIMIT);

            pieces.forEach(p => {   
                const px = p.size * GRID_SIZE;
                ctx.save();

                // 1. Draw the Square Body
                if (p.heldBy === myId) {
                    ctx.shadowColor = "rgba(0, 0, 0, 0.1)";
                    ctx.shadowBlur = 10;
                    ctx.shadowOffsetX = 4;
                    ctx.shadowOffsetY = 4;
                    ctx.fillStyle = p.color;
                    drawRoundedRect(ctx, p.x - 1, p.y - 1, px + 2, px + 2, 6);
                } else {
                    ctx.fillStyle = p.color;
                    drawRoundedRect(ctx, p.x + 1, p.y + 1, px - 2, px - 2, 4);
                }

                // 2. Draw the "Fixed" Center Pin
                if (p.isLocked) {
                    // Calculate the center point
                    const centerX = p.x + px / 2;
                    const centerY = p.y + px / 2;
                    
                    // Scale the radius: proportional to size, but with a minimum
                    const dotRadius = Math.max(2, px / 10);

                    ctx.fillStyle = "rgba(0, 0, 0, 0.25)"; // Muted dark dot
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, dotRadius, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 3. Draw standard borders for movable/held pieces
                if (p.heldBy) {
                    ctx.strokeStyle = p.heldBy === myId ? "#81b29a" : "#e07a5f";
                    ctx.lineWidth = 2;
                    ctx.stroke(); 
                } else {
                    // Very subtle edge for unheld, placed pieces
                    ctx.strokeStyle = "rgba(0,0,0,0.05)";
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
                
                ctx.restore();
            });
        }

        document.getElementById('resetBtn').onclick = () => confirm("Reset board?") && socket.emit('resetBoard', { roomId: roomID });
        document.getElementById('checkBtn').onclick = () => socket.emit('checkSolution', { roomId: roomID });
        socket.on('solutionResult', (res) => alert(res ? "🎉 Correct!" : "❌ Try again!"));

        document.getElementById('backToLobbyBtn').onclick = () => {
            openRoomPicker();
            switchRoom("lobby");
        };

        // Menu popover (placed to the right of the supply palette)
        let menuIsOpen = false;
        function openMenu() {
            menuIsOpen = true;
            document.getElementById('menuOverlay').style.display = 'block';
            document.getElementById('menuModal').style.display = 'block';
        }
        function closeMenu() {
            menuIsOpen = false;
            document.getElementById('menuOverlay').style.display = 'none';
            document.getElementById('menuModal').style.display = 'none';
        }

        document.getElementById('openMenuBtn').onclick = () => menuIsOpen ? closeMenu() : openMenu();
        document.getElementById('closeMenuBtn').onclick = closeMenu;
        document.getElementById('menuOverlay').onclick = closeMenu;

        // Escape closes menu first; otherwise closes the room picker if you're already in a room with an active board
        window.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            if (menuIsOpen) {
                closeMenu();
                return;
            }
            if (!forceHomeScreen) return;
            if (pieces && pieces.length > 0) {
                forceHomeScreen = false;
                document.getElementById('homeScreen').style.display = 'none';
            }
        });
    </script>
</body>
</html>
